[package]
name = "codexi"
description = "Library of codexi (financial ledger)"
version = "0.6.0"
edition = "2024"
license = "MIT"

[package.metadata.scrutinium]
status = "stable"
started = "2025-09"

[lib]
crate-type = ["lib"]

[dependencies]
# Error
miette  = { workspace = true }
thiserror  = { workspace = true }

#Date/Time
chrono = { workspace = true }

# Id
nulid = { workspace = true }

# Serialization / Deserialization
serde = { workspace = true }
serde_json = { workspace = true }
toml =  { workspace = true }
csv  =  { workspace = true }
ciborium =  { workspace = true }

# Checksum
sha2 =  { workspace = true }

# Decimal to replace f64
rust_decimal = { workspace = true }

# Backup/restore
tar = { workspace = true }
flate2 = { workspace = true }
walkdir = { workspace = true }

# Utilities
dirs = { workspace = true }
thousands = { workspace = true }
derive_builder = { workspace = true }

[dev-dependencies]
rust_decimal_macros =  { workspace = true }
