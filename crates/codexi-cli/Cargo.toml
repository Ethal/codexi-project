[package]
name = "codexi-cli"
description = "Command-line of a financial ledger focused on auditability, traceability and long-term data integrity"
version = "0.5.0"
edition = "2024"
license = "MIT"

[package.metadata.scrutinium]
status = "stable"
started = "2025-09"

[[bin]]
name = "codexi-cli"
path = "src/main.rs"

[dependencies]
# Project librairy
codexi = { path = "../codexi" }

# Error
anyhow  = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Decimal to replace f64
rust_decimal = { workspace = true }
rust_decimal_macros =  { workspace = true }

# CLI
clap = { workspace = true }
# html report
minijinja = { workspace = true }
opener = { workspace = true }

# Utilities
thousands = { workspace = true }
dialoguer = { workspace = true }
console = { workspace = true }
chrono = { workspace = true }

# Tui
inquire = { workspace = true }
inquire-derive = { workspace = true }
crossterm = { workspace = true }
